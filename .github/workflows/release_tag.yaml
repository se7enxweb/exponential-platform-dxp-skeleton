name: Call Create Release for tag Workflow

# Creates the GitHub release for a pushed tag when none exists yet (an
# existing release is never edited). On demand: the notes for any tag,
# with dry-run to only print them.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag'
        required: true
        type: string
      dry-run:
        description: 'Only print the release notes'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  create_release_for_tag:
    uses: se7enxweb/gh-workflows/.github/workflows/release.yml@main
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      wait-minutes: ${{ github.event_name != 'workflow_dispatch' && 10 || 0 }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
